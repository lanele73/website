<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fotos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>fotos</h1>
        <p class="subtitle">Lorenzo Kogler Anele</p>
    </header>

    <main>
        <div class="gallery" id="gallery">
            <!-- Gallery items are generated by script.js from photos.js -->
        </div>
    </main>

    <button type="button" class="slideshow-play" id="slideshow-play" aria-label="Play slideshow">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <polygon points="8,5 19,12 8,19" />
        </svg>
    </button>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <span class="prev" aria-label="Previous photo">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <polygon points="8,5 19,12 8,19" />
            </svg>
        </span>
        <span class="next" aria-label="Next photo">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <polygon points="8,5 19,12 8,19" />
            </svg>
        </span>
        <div class="lightbox-stage">
            <img class="lightbox-content" id="lightbox-img" alt="">
            <div class="caption" id="caption"></div>
        </div>
    </div>

    <script src="photos.js"></script>
    <script src="script.js"></script>
</body>
</html>
